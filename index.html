<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Story of Toqu — komadua.toqu</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,400;1,600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #09090B;
      --surface: #0F0F12;
      --surface-hover: #141418;
      --text-main: #E4E4E7;
      --text-muted: #71717A;
      --cobalt: #5B8FB9;      /* Biru baja dingin & sunyi */
      --oxblood: #9F1239;     /* Merah anggur gelap & getir */
      --border: #1E1E24;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      font-family: 'Inter', sans-serif;
      font-weight: 300;
      line-height: 1.8;
      -webkit-font-smoothing: antialiased;
      padding: 0 24px;
      position: relative;
      overflow-x: hidden;
    }

    /* Pencahayaan Dramatis Sangat Halus di Latar */
    body::before {
      content: "";
      position: fixed;
      top: -20%; right: -10%;
      width: 55vw; height: 55vw;
      background: radial-gradient(circle, rgba(91, 143, 185, 0.05) 0%, transparent 65%);
      pointer-events: none;
      z-index: 0;
    }
    body::after {
      content: "";
      position: fixed;
      bottom: -20%; left: -10%;
      width: 50vw; height: 50vw;
      background: radial-gradient(circle, rgba(159, 18, 57, 0.04) 0%, transparent 65%);
      pointer-events: none;
      z-index: 0;
    }

    /* Progress Bar Sehelai Rambut */
    #progress-container {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 2px;
      background: transparent;
      z-index: 100;
      display: none;
    }
    #progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--cobalt), var(--oxblood));
      transition: width 0.1s ease-out;
    }

    .container {
      max-width: 640px;
      margin: 0 auto;
      padding: 64px 0 96px;
      position: relative;
      z-index: 1;
    }

    /* Header Editorial */
    header {
      margin-bottom: 48px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 32px;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 20px;
      position: relative;
    }
    .kicker {
      font-size: 0.72rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--cobalt);
      margin-bottom: 8px;
    }
    .brand-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 2.5rem;
      font-weight: 600;
      letter-spacing: -0.01em;
      line-height: 1.1;
      color: #F4F4F5;
    }
    .brand-title span {
      color: var(--oxblood);
      font-style: italic;
      margin-left: 2px;
    }
    .brand-author {
      font-size: 0.82rem;
      color: var(--text-muted);
      margin-top: 8px;
      letter-spacing: 0.08em;
    }

    /* Emblem Ukiran Kupu-Kupu Geometris (Statis & Tajam) */
    .emblem-mark {
      width: 54px;
      height: 54px;
      flex-shrink: 0;
      opacity: 0.85;
    }

    /* Prolog Sastra */
    .prolog {
      border-left: 1px solid var(--oxblood);
      padding: 4px 0 4px 22px;
      margin-bottom: 48px;
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      color: #D4D4D8;
      font-size: 1.22rem;
      line-height: 1.65;
    }

    /* Navigasi Arc */
    .arc-tabs {
      display: flex;
      gap: 24px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 32px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .arc-tabs::-webkit-scrollbar { display: none; }
    .tab-btn {
      background: none;
      border: none;
      border-bottom: 1px solid transparent;
      color: var(--text-muted);
      padding: 0 0 12px 0;
      font-family: 'Inter', sans-serif;
      font-size: 0.8rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      white-space: nowrap;
      cursor: pointer;
      transition: color 0.2s, border-color 0.2s;
    }
    .tab-btn.active {
      color: var(--text-main);
      border-bottom-color: var(--cobalt);
    }
    .tab-btn.locked {
      opacity: 0.35;
      cursor: not-allowed;
    }

    .arc-header {
      margin-bottom: 28px;
    }
    .arc-header h2 {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.5rem;
      font-weight: 500;
      color: #F4F4F5;
    }
    .arc-header p {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-top: 4px;
    }

    /* Daftar Cerita Bergaya Indeks Buku */
    .story-list {
      display: flex;
      flex-direction: column;
      border-top: 1px solid var(--border);
    }
    .story-card {
      padding: 22px 4px;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      transition: background 0.25s, padding-left 0.25s;
      position: relative;
    }
    .story-card:hover:not(.locked-card) {
      background: linear-gradient(90deg, rgba(91, 143, 185, 0.04) 0%, transparent 100%);
      padding-left: 12px;
    }
    .story-card:hover:not(.locked-card) .story-title {
      color: var(--cobalt);
    }
    .story-card.locked-card {
      opacity: 0.42;
      cursor: default;
    }
    .story-meta {
      display: flex;
      justify-content: space-between;
      font-size: 0.72rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--oxblood);
      margin-bottom: 6px;
    }
    .story-card.locked-card .story-meta {
      color: var(--text-muted);
    }
    .story-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.4rem;
      font-weight: 600;
      color: #F4F4F5;
      margin-bottom: 6px;
      transition: color 0.2s;
    }
    .story-premise {
      font-size: 0.88rem;
      color: var(--text-muted);
      line-height: 1.6;
    }

    /* Mode Baca */
    #reader-view {
      display: none;
      animation: fadeIn 0.35s ease;
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    .back-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 0.78rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 36px;
      padding: 4px 0;
      transition: color 0.2s;
    }
    .back-btn:hover { color: var(--cobalt); }

    .reader-chapter {
      font-size: 0.75rem;
      color: var(--oxblood);
      letter-spacing: 0.2em;
      text-transform: uppercase;
      margin-bottom: 10px;
    }
    .reader-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 2.35rem;
      font-weight: 600;
      line-height: 1.2;
      color: #F4F4F5;
      margin-bottom: 36px;
      padding-bottom: 24px;
      border-bottom: 1px solid var(--border);
    }
    .reader-body p {
      margin-bottom: 22px;
      font-size: 1.02rem;
      color: #D4D4D8;
      text-align: left;
    }
    .reader-body p:first-of-type::first-letter {
      font-family: 'Cormorant Garamond', serif;
      font-size: 3.1rem;
      float: left;
      line-height: 0.85;
      padding-right: 10px;
      padding-top: 4px;
      color: var(--cobalt);
    }

    /* Kotak Kutipan & Tautan WhatsApp */
    .quote-box {
      margin: 48px 0 32px;
      padding: 24px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-left: 2px solid var(--oxblood);
    }
    .quote-text {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: 1.15rem;
      color: #E4E4E7;
      margin-bottom: 18px;
      line-height: 1.6;
    }
    .action-row {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }
    .btn {
      padding: 10px 18px;
      font-size: 0.78rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border: 1px solid var(--border);
      transition: all 0.25s;
    }
    .btn-copy {
      background: transparent;
      color: var(--text-muted);
    }
    .btn-copy:hover {
      border-color: var(--text-main);
      color: var(--text-main);
    }
    .btn-wa {
      background: rgba(91, 143, 185, 0.08);
      border-color: var(--cobalt);
      color: var(--cobalt);
    }
    .btn-wa:hover {
      background: var(--cobalt);
      color: #09090B;
    }

    /* Footer */
    footer {
      margin-top: 80px;
      padding-top: 32px;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
      font-size: 0.8rem;
      color: var(--text-muted);
    }
    .social-links {
      display: flex;
      gap: 20px;
    }
    .social-links a {
      color: var(--text-muted);
      text-decoration: none;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-size: 0.75rem;
      transition: color 0.2s;
    }
    .social-links a:hover {
      color: var(--cobalt);
    }
  </style>
</head>
<body>

  <div id="progress-container"><div id="progress-bar"></div></div>

  <div class="container">
    <div id="home-view">
      <header>
        <div>
          <div class="kicker">Antologi Jeda &amp; Kehampaan</div>
          <div class="brand-title">Story of Toqu<span>,</span></div>
          <div class="brand-author">ditulis oleh komadua.toqu</div>
        </div>
        <!-- Ukiran Kupu-Kupu Geometris Berujung Koma (Statis, Dewasa, Tajam) -->
        <svg class="emblem-mark" viewBox="0 0 80 80" fill="none" aria-label="Emblem Story of Toqu">
          <!-- Sayap Kiri Atas & Bawah -->
          <path d="M38 38 C26 16, 8 14, 12 34 C14 44, 28 45, 36 40" stroke="#5B8FB9" stroke-width="1.2"/>
          <path d="M36 41 C24 48, 16 62, 26 66 C32 68, 36 54, 38 43" stroke="#5B8FB9" stroke-width="1.2"/>
          <!-- Sayap Kanan Atas & Bawah -->
          <path d="M42 38 C54 16, 72 14, 68 34 C66 44, 52 45, 44 40" stroke="#5B8FB9" stroke-width="1.2"/>
          <path d="M44 41 C56 48, 64 62, 54 66 C48 68, 44 54, 42 43" stroke="#5B8FB9" stroke-width="1.2"/>
          <!-- Serat Halus Dalam Sayap -->
          <path d="M37 38 L18 28 M37 40 L24 56 M43 38 L62 28 M43 40 L56 56" stroke="#5B8FB9" stroke-width="0.6" stroke-opacity="0.5"/>
          <!-- Inti / Simpul Merah Gelap -->
          <line x1="40" y1="26" x2="40" y2="52" stroke="#9F1239" stroke-width="1.5"/>
          <circle cx="40" cy="39" r="2.2" fill="#9F1239"/>
        </svg>
      </header>

      <div class="prolog" id="prolog-text"></div>

      <div class="arc-tabs">
        <button class="tab-btn active">Arc I — Kehampaan</button>
        <button class="tab-btn locked" title="Belum dibuka">Arc II — Terkunci</button>
        <button class="tab-btn locked" title="Belum dibuka">Arc III — Terkunci</button>
      </div>

      <div class="arc-header">
        <h2>Kehampaan yang Menyala Pelan</h2>
        <p>Dua puluh fragmen kehidupan yang terhenti di tengah kalimat.</p>
      </div>

      <div class="story-list" id="story-list"></div>
    </div>

    <div id="reader-view">
      <button class="back-btn" onclick="closeStory()">← Kembali ke Indeks</button>
      <div class="reader-chapter" id="reader-chapter"></div>
      <h1 class="reader-title" id="reader-title"></h1>
      <div class="reader-body" id="reader-body"></div>

      <div class="quote-box">
        <div class="quote-text" id="reader-quote"></div>
        <div class="action-row">
          <button class="btn btn-copy" id="copy-btn" onclick="copyQuote()">Salin Kutipan</button>
          <a class="btn btn-wa" id="wa-story-btn" href="#" target="_blank" rel="noopener">Kirim Catatan ke WhatsApp ↗</a>
        </div>
      </div>
    </div>

    <footer>
      <div>Tidak semua yang pergi meninggalkan titik.</div>
      <div class="social-links">
        <a id="wa-footer-link" href="#" target="_blank" rel="noopener">WhatsApp</a>
        <a id="ig-footer-link" href="#" target="_blank" rel="noopener">Instagram</a>
      </div>
    </footer>
  </div>

  <script src="cerita.js"></script>
  <script>
    const storyListEl = document.getElementById('story-list');
    const homeView = document.getElementById('home-view');
    const readerView = document.getElementById('reader-view');
    const progressContainer = document.getElementById('progress-container');
    const progressBar = document.getElementById('progress-bar');

    document.getElementById('prolog-text').textContent = PROFIL.prolog;
    document.getElementById('wa-footer-link').href = `https://wa.me/${PROFIL.nomorWA}?text=${encodeURIComponent("Halo komadua.toqu, aku baru saja membaca arsip Story of Toqu...")}`;
    const igLink = document.getElementById('ig-footer-link');
    igLink.href = `https://instagram.com/${PROFIL.usernameIG}`;
    igLink.textContent = `@${PROFIL.usernameIG}`;

    DAFTAR_CERITA.forEach((story, index) => {
      const isPublished = story.content && story.content.length > 0;
      const card = document.createElement('div');
      card.className = `story-card ${isPublished ? '' : 'locked-card'}`;
      card.innerHTML = `
        <div class="story-meta">
          <span>Bab ${story.num}</span>
          <span>${isPublished ? (story.readTime || '3 menit baca') : 'Belum terbit'}</span>
        </div>
        <div class="story-title">${story.title}</div>
        <div class="story-premise">${story.premise}</div>
      `;
      if (isPublished) {
        card.onclick = () => openStory(index);
      }
      storyListEl.appendChild(card);
    });

    function openStory(index) {
      const story = DAFTAR_CERITA[index];
      document.getElementById('reader-chapter').textContent = `Arc I • Bab ${story.num}`;
      document.getElementById('reader-title').textContent = story.title;
      document.getElementById('reader-body').innerHTML = story.content.map(p => `<p>${p}</p>`).join('');
      document.getElementById('reader-quote').textContent = story.quote || `“${story.premise}”`;

      const waMsg = `Halo komadua.toqu, aku baru selesai membaca Bab ${story.num} (${story.title}) di Story of Toqu...`;
      document.getElementById('wa-story-btn').href = `https://wa.me/${PROFIL.nomorWA}?text=${encodeURIComponent(waMsg)}`;

      homeView.style.display = 'none';
      readerView.style.display = 'block';
      progressContainer.style.display = 'block';
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function closeStory() {
      readerView.style.display = 'none';
      progressContainer.style.display = 'none';
      homeView.style.display = 'block';
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function copyQuote() {
      const quote = document.getElementById('reader-quote').textContent;
      navigator.clipboard.writeText(`${quote} — Story of Toqu (@${PROFIL.usernameIG})`).then(() => {
        const btn = document.getElementById('copy-btn');
        btn.textContent = "Tersalin";
        setTimeout(() => { btn.textContent = "Salin Kutipan"; }, 2000);
      });
    }

    window.addEventListener('scroll', () => {
      if (readerView.style.display === 'block') {
        const scrollTop = window.scrollY;
        const docHeight = document.documentElement.scrollHeight - window.innerHeight;
        const percent = docHeight > 0 ? (scrollTop / docHeight) * 100 : 0;
        progressBar.style.width = `${Math.min(percent, 100)}%`;
      }
    });
  </script>
</body>
</html>
