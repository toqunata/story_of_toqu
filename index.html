<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Story of Toqu,, — komadua.toqu</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,400;1,600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #08080A;
      --surface: #0E0E12;
      --text-primary: #F4F4F6;
      --text-secondary: #D4D4D8;
      --ash-silver: #9CA3AF;
      --text-muted: #787885;
      --crimson: #E11D48;
      --crimson-soft: rgba(225, 29, 72, 0.12);
      --steel-blue: #60A5FA;
      --border: #1C1C22;
      --border-hover: #2E2E38;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg);
      color: var(--text-primary);
      font-family: 'Inter', sans-serif;
      font-weight: 300;
      line-height: 1.85;
      -webkit-font-smoothing: antialiased;
      padding: 0 24px;
      position: relative;
      overflow-x: hidden;
    }

    /* Pencahayaan Dramatis Sangat Halus */
    body::before {
      content: "";
      position: fixed;
      top: -15%; left: 50%;
      transform: translateX(-50%);
      width: 70vw; height: 45vh;
      background: radial-gradient(ellipse at center, rgba(225, 29, 72, 0.045) 0%, rgba(156, 163, 175, 0.02) 45%, transparent 75%);
      pointer-events: none;
      z-index: 0;
    }

    /* Progress Bar Sehelai Rambut */
    #progress-container {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 2px;
      background: rgba(255, 255, 255, 0.03);
      z-index: 100;
      display: none;
    }
    #progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--ash-silver) 0%, var(--crimson) 100%);
      transition: width 0.1s ease-out;
    }

    .container {
      max-width: 650px;
      margin: 0 auto;
      padding: 68px 0 100px;
      position: relative;
      z-index: 1;
    }

    /* Header Editorial */
    header {
      margin-bottom: 44px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 32px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 24px;
    }
    .kicker {
      font-size: 0.72rem;
      font-weight: 500;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      color: var(--crimson);
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .kicker::before {
      content: "";
      display: inline-block;
      width: 14px;
      height: 1px;
      background-color: var(--crimson);
    }
    .brand-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 2.75rem;
      font-weight: 600;
      letter-spacing: -0.015em;
      line-height: 1.05;
      color: var(--text-primary);
    }
    .brand-title .comma-mark {
      color: var(--crimson);
      font-style: italic;
      letter-spacing: -0.06em;
      margin-left: 2px;
    }
    .brand-author {
      font-size: 0.84rem;
      color: var(--text-muted);
      margin-top: 10px;
      letter-spacing: 0.06em;
    }
    .brand-author strong {
      color: var(--ash-silver);
      font-weight: 400;
    }

    /* Emblem Kupu-Kupu Profil Samping & Siluet Dua Koma */
    .emblem-wrapper {
      width: 68px;
      height: 68px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--border);
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #131318, #08080A);
    }
    .emblem-svg {
      width: 44px;
      height: 44px;
      display: block;
    }

    /* Prolog Manifesto */
    .prolog {
      border-left: 2px solid var(--crimson);
      padding: 6px 0 6px 22px;
      margin-bottom: 52px;
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      color: var(--text-secondary);
      font-size: 1.26rem;
      line-height: 1.65;
    }

    /* Navigasi Tab Arc */
    .arc-tabs {
      display: flex;
      gap: 28px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 32px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .arc-tabs::-webkit-scrollbar { display: none; }
    .tab-btn {
      background: none;
      border: none;
      border-bottom: 2px solid transparent;
      color: var(--text-muted);
      padding: 0 0 14px 0;
      font-family: 'Inter', sans-serif;
      font-size: 0.78rem;
      font-weight: 500;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      white-space: nowrap;
      cursor: pointer;
      transition: color 0.2s, border-color 0.2s;
    }
    .tab-btn.active {
      color: var(--text-primary);
      border-bottom-color: var(--crimson);
    }
    .tab-btn.locked {
      opacity: 0.35;
      cursor: not-allowed;
    }

    /* Judul Sub-Bab Arc */
    .arc-header {
      margin-bottom: 28px;
    }
    .arc-header h2 {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.6rem;
      font-weight: 600;
      color: var(--text-primary);
      letter-spacing: 0.01em;
    }
    .arc-header p {
      font-size: 0.88rem;
      color: var(--text-muted);
      margin-top: 4px;
    }

    /* Daftar Cerita (Indeks Editorial) */
    .story-list {
      display: flex;
      flex-direction: column;
      border-top: 1px solid var(--border);
    }
    .story-card {
      padding: 24px 8px;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      transition: background 0.25s ease, padding-left 0.25s ease, border-color 0.25s ease;
    }
    .story-card:hover:not(.locked-card) {
      background: linear-gradient(90deg, rgba(225, 29, 72, 0.04) 0%, transparent 100%);
      padding-left: 16px;
      border-bottom-color: var(--border-hover);
    }
    .story-card:hover:not(.locked-card) .story-title {
      color: #FFFFFF;
    }
    .story-card.locked-card {
      opacity: 0.42;
      cursor: default;
    }

    /* Label Sub-Bab & Durasi Baca */
    .story-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.74rem;
      font-weight: 500;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      margin-bottom: 8px;
    }
    .story-bab {
      color: var(--crimson);
    }
    .story-time {
      color: var(--ash-silver);
      font-weight: 400;
    }
    .story-card.locked-card .story-bab,
    .story-card.locked-card .story-time {
      color: var(--text-muted);
    }

    .story-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.48rem;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 6px;
      line-height: 1.25;
      transition: color 0.2s;
    }
    .story-premise {
      font-size: 0.9rem;
      color: var(--text-muted);
      line-height: 1.65;
    }

    /* Mode Baca (Reader View) */
    #reader-view {
      display: none;
      animation: fadeIn 0.35s ease;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .back-btn {
      background: none;
      border: none;
      color: var(--ash-silver);
      font-size: 0.78rem;
      font-weight: 500;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 36px;
      padding: 4px 0;
      transition: color 0.2s;
    }
    .back-btn:hover { color: var(--crimson); }

    .reader-chapter {
      font-size: 0.76rem;
      font-weight: 600;
      color: var(--crimson);
      letter-spacing: 0.2em;
      text-transform: uppercase;
      margin-bottom: 10px;
    }
    .reader-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 2.5rem;
      font-weight: 600;
      line-height: 1.18;
      color: var(--text-primary);
      margin-bottom: 36px;
      padding-bottom: 24px;
      border-bottom: 1px solid var(--border);
    }
    .reader-body p {
      margin-bottom: 24px;
      font-size: 1.04rem;
      color: var(--text-secondary);
    }
    .reader-body p:first-of-type::first-letter {
      font-family: 'Cormorant Garamond', serif;
      font-size: 3.3rem;
      font-weight: 600;
      float: left;
      line-height: 0.82;
      padding-right: 12px;
      padding-top: 4px;
      color: var(--crimson);
    }

    /* Kotak Kutipan & Jembatan WhatsApp */
    .quote-box {
      margin: 52px 0 32px;
      padding: 26px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-left: 2px solid var(--crimson);
    }
    .quote-text {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: 1.2rem;
      color: var(--text-primary);
      margin-bottom: 20px;
      line-height: 1.6;
    }
    .action-row {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }
    .btn {
      padding: 11px 18px;
      font-size: 0.76rem;
      font-weight: 500;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border: 1px solid var(--border);
      transition: all 0.25s ease;
    }
    .btn-copy {
      background: transparent;
      color: var(--ash-silver);
    }
    .btn-copy:hover {
      border-color: var(--text-primary);
      color: var(--text-primary);
    }
    .btn-wa {
      background: var(--crimson-soft);
      border-color: var(--crimson);
      color: #FDA4AF;
    }
    .btn-wa:hover {
      background: var(--crimson);
      color: #FFFFFF;
    }

    /* Footer */
    footer {
      margin-top: 84px;
      padding-top: 32px;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
      font-size: 0.82rem;
      color: var(--text-muted);
    }
    .social-links {
      display: flex;
      gap: 22px;
    }
    .social-links a {
      color: var(--ash-silver);
      text-decoration: none;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      font-size: 0.74rem;
      transition: color 0.2s;
    }
    .social-links a:hover {
      color: var(--crimson);
    }

    @media (max-width: 480px) {
      .brand-title { font-size: 2.2rem; }
      .emblem-wrapper { width: 56px; height: 56px; }
      .emblem-svg { width: 36px; height: 36px; }
      .reader-title { font-size: 2rem; }
    }
  </style>
</head>
<body>

  <div id="progress-container"><div id="progress-bar"></div></div>

  <div class="container">
    <div id="home-view">
      <header>
        <div>
          <div class="kicker">Antologi Jeda &amp; Kehampaan</div>
          <h1 class="brand-title">Story of Toqu<span class="comma-mark">,,</span></h1>
          <div class="brand-author">ditulis oleh <strong>komadua.toqu</strong></div>
        </div>
        
        <!-- Emblem Kupu-Kupu Profil Samping dengan Siluet Dua Koma yang Menyatu di Sayap -->
        <div class="emblem-wrapper" title="Simbol Jeda — komadua.toqu">
          <svg class="emblem-svg" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
            <!-- Sayap Atas (Siluet Koma Pertama) -->
            <path d="M16 12 C28 10, 40 20, 44 30 C36 33, 24 31, 18 24 C14 19, 13 14, 16 12 Z" stroke="#E4E4E7" stroke-width="1.35" stroke-linejoin="round"/>
            <!-- Sayap Bawah (Siluet Koma Kedua dengan Ekor Melengkung) -->
            <path d="M24 31 C33 31, 41 35, 42 42 C37 46, 28 47, 23 53 C21 55, 19 54, 21 50 C24 44, 20 36, 24 31 Z" stroke="#9CA3AF" stroke-width="1.3" stroke-linejoin="round"/>
            <!-- Urat Sayap Halus (Abu-abu Perak & Sentuhan Biru Baja Redup) -->
            <path d="M18 16 L41 29 M22 21 L37 30" stroke="#60A5FA" stroke-width="0.85" stroke-opacity="0.65" stroke-linecap="round"/>
            <path d="M25 34 L38 41 M24 39 L31 45" stroke="#9CA3AF" stroke-width="0.8" stroke-opacity="0.55" stroke-linecap="round"/>
            <!-- Ekor Koma Merah Crimson di Ujung Bawah Sayap -->
            <path d="M27 46 C25 49, 23 52, 20.5 54" stroke="#E11D48" stroke-width="1.5" stroke-linecap="round"/>
            <!-- Antena Tipis -->
            <path d="M44 29 C46 24, 48 20, 47 18 M45 30 C48 26, 50 23, 50 21" stroke="#9CA3AF" stroke-width="1.1" stroke-linecap="round"/>
            <!-- Simpul Inti Merah Crimson -->
            <circle cx="43.5" cy="30.5" r="2" fill="#E11D48"/>
          </svg>
        </div>
      </header>

      <div class="prolog" id="prolog-text"></div>

      <div class="arc-tabs">
        <button class="tab-btn active">Arc I — Kehampaan</button>
        <button class="tab-btn locked" title="Belum dibuka">Arc II — Terkunci</button>
        <button class="tab-btn locked" title="Belum dibuka">Arc III — Terkunci</button>
      </div>

      <div class="arc-header">
        <h2>Kehampaan yang Menyala Pelan</h2>
        <p>Dua puluh fragmen kehidupan yang terhenti di tengah kalimat.</p>
      </div>

      <div class="story-list" id="story-list"></div>
    </div>

    <div id="reader-view">
      <button class="back-btn" onclick="closeStory()">← Kembali ke Awal</button>
      <div class="reader-chapter" id="reader-chapter"></div>
      <h1 class="reader-title" id="reader-title"></h1>
      <div class="reader-body" id="reader-body"></div>

      <div class="quote-box">
        <div class="quote-text" id="reader-quote"></div>
        <div class="action-row">
          <button class="btn btn-copy" id="copy-btn" onclick="copyQuote()">Salin Kutipan</button>
          <a class="btn btn-wa" id="wa-story-btn" href="#" target="_blank" rel="noopener">Kirim Catatan ke WhatsApp ↗</a>
        </div>
      </div>
    </div>

    <footer>
      <div>Tidak semua yang pergi meninggalkan titik.</div>
      <div class="social-links">
        <a id="wa-footer-link" href="#" target="_blank" rel="noopener">WhatsApp</a>
        <a id="ig-footer-link" href="#" target="_blank" rel="noopener">Instagram</a>
      </div>
    </footer>
  </div>

  <script src="cerita.js"></script>
  <script>
    const storyListEl = document.getElementById('story-list');
    const homeView = document.getElementById('home-view');
    const readerView = document.getElementById('reader-view');
    const progressContainer = document.getElementById('progress-container');
    const progressBar = document.getElementById('progress-bar');

    document.getElementById('prolog-text').textContent = PROFIL.prolog;
    document.getElementById('wa-footer-link').href = `https://wa.me/${PROFIL.nomorWA}?text=${encodeURIComponent("Halo komadua.toqu, aku baru saja membaca arsip Story of Toqu...")}`;
    const igLink = document.getElementById('ig-footer-link');
    igLink.href = `https://instagram.com/${PROFIL.usernameIG}`;
    igLink.textContent = `@${PROFIL.usernameIG}`;

    DAFTAR_CERITA.forEach((story, index) => {
      const isPublished = story.content && story.content.length > 0;
      const card = document.createElement('div');
      card.className = `story-card ${isPublished ? '' : 'locked-card'}`;
      card.innerHTML = `
        <div class="story-meta">
          <span class="story-bab">Bab ${story.num}</span>
          <span class="story-time">${isPublished ? (story.readTime || '3 menit baca') : 'Belum terbit'}</span>
        </div>
        <div class="story-title">${story.title}</div>
        <div class="story-premise">${story.premise}</div>
      `;
      if (isPublished) {
        card.onclick = () => openStory(index);
      }
      storyListEl.appendChild(card);
    });

    function openStory(index) {
      const story = DAFTAR_CERITA[index];
      document.getElementById('reader-chapter').textContent = `Arc I • Bab ${story.num}`;
      document.getElementById('reader-title').textContent = story.title;
      document.getElementById('reader-body').innerHTML = story.content.map(p => `<p>${p}</p>`).join('');
      document.getElementById('reader-quote').textContent = story.quote || `“${story.premise}”`;

      const waMsg = `Halo komadua.toqu, aku baru selesai membaca Bab ${story.num} (${story.title}) di Story of Toqu...`;
      document.getElementById('wa-story-btn').href = `https://wa.me/${PROFIL.nomorWA}?text=${encodeURIComponent(waMsg)}`;

      homeView.style.display = 'none';
      readerView.style.display = 'block';
      progressContainer.style.display = 'block';
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function closeStory() {
      readerView.style.display = 'none';
      progressContainer.style.display = 'none';
      homeView.style.display = 'block';
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function copyQuote() {
      const quote = document.getElementById('reader-quote').textContent;
      navigator.clipboard.writeText(`${quote} — Story of Toqu (@${PROFIL.usernameIG})`).then(() => {
        const btn = document.getElementById('copy-btn');
        btn.textContent = "Tersalin";
        setTimeout(() => { btn.textContent = "Salin Kutipan"; }, 2000);
      });
    }

    window.addEventListener('scroll', () => {
      if (readerView.style.display === 'block') {
        const scrollTop = window.scrollY;
        const docHeight = document.documentElement.scrollHeight - window.innerHeight;
        const percent = docHeight > 0 ? (scrollTop / docHeight) * 100 : 0;
        progressBar.style.width = `${Math.min(percent, 100)}%`;
      }
    });
  </script>
</body>
</html>
