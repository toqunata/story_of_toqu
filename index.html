  <style>
    :root {
      --bg: #0A0A0D;
      --surface: #121217;
      --surface-hover: #181820;
      --text-main: #E4E4E7;
      --text-muted: #8E8E9A;
      --blue-glow: #38BDF8;
      --blue-deep: #0284C7;
      --red-accent: #E11D48;
      --border: #23232D;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg);
      background-image: 
        radial-gradient(circle at 85% 12%, rgba(56, 189, 248, 0.06) 0%, transparent 38%),
        radial-gradient(circle at 12% 75%, rgba(225, 29, 72, 0.05) 0%, transparent 42%);
      color: var(--text-main);
      font-family: 'Plus Jakarta Sans', sans-serif;
      line-height: 1.75;
      -webkit-font-smoothing: antialiased;
      padding: 0 20px;
      overflow-x: hidden;
      position: relative;
    }

    /* Partikel Kupu-Kupu Melayang di Latar Belakang */
    .butterfly-bg {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }
    .spirit-butterfly {
      position: absolute;
      width: 22px;
      height: 22px;
      opacity: 0;
      filter: drop-shadow(0 0 6px rgba(56, 189, 248, 0.75));
      animation: floatSpirit 18s infinite ease-in-out;
    }
    .spirit-butterfly:nth-child(1) {
      top: 18%; left: 12%;
      animation-delay: 0s;
      animation-duration: 20s;
    }
    .spirit-butterfly:nth-child(2) {
      top: 62%; right: 14%;
      width: 16px; height: 16px;
      animation-delay: 6s;
      animation-duration: 24s;
    }
    .spirit-butterfly:nth-child(3) {
      top: 40%; left: 78%;
      width: 14px; height: 14px;
      filter: drop-shadow(0 0 6px rgba(225, 29, 72, 0.65));
      animation-delay: 11s;
      animation-duration: 22s;
    }

    @keyframes floatSpirit {
      0% { transform: translate(0, 20px) rotate(-8deg) scale(0.9); opacity: 0; }
      20% { opacity: 0.38; }
      50% { transform: translate(18px, -35px) rotate(6deg) scale(1.05); opacity: 0.45; }
      80% { opacity: 0.25; }
      100% { transform: translate(-10px, -85px) rotate(-12deg) scale(0.9); opacity: 0; }
    }

    /* Progress Bar Tanda Koma dengan Gradien Biru-Merah */
    #progress-container {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 3px;
      background: transparent;
      z-index: 100;
      display: none;
    }
    #progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--blue-glow), var(--red-accent));
      position: relative;
      transition: width 0.1s ease-out;
      box-shadow: 0 0 8px rgba(56, 189, 248, 0.6);
    }
    #progress-bar::after {
      content: ",";
      position: absolute;
      right: -4px; top: -7px;
      color: var(--red-accent);
      font-family: 'Lora', serif;
      font-size: 20px;
      font-weight: bold;
      text-shadow: 0 0 6px rgba(225, 29, 72, 0.8);
    }

    .container {
      max-width: 660px;
      margin: 0 auto;
      padding: 52px 0 80px;
      position: relative;
      z-index: 1;
    }

    /* Header & Emblem Kupu-Kupu Biru */
    header {
      margin-bottom: 36px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
    }
