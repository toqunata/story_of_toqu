<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Story of Toqu — komadua.toqu</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0E0E10;
      --surface: #16161A;
      --surface-hover: #1E1E24;
      --text-main: #E4E4E7;
      --text-muted: #8E8E98;
      --accent: #D4AF37;
      --border: #27272E;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      font-family: 'Plus Jakarta Sans', sans-serif;
      line-height: 1.75;
      -webkit-font-smoothing: antialiased;
      padding: 0 20px;
    }

    #progress-container {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 3px;
      background: transparent;
      z-index: 100;
      display: none;
    }
    #progress-bar {
      height: 100%;
      width: 0%;
      background: var(--accent);
      position: relative;
      transition: width 0.1s ease-out;
    }
    #progress-bar::after {
      content: ",";
      position: absolute;
      right: -4px; top: -6px;
      color: var(--accent);
      font-family: 'Lora', serif;
      font-size: 18px;
      font-weight: bold;
    }

    .container {
      max-width: 660px;
      margin: 0 auto;
      padding: 52px 0 80px;
    }

    header {
      margin-bottom: 36px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 24px;
    }
    .brand-title {
      font-family: 'Lora', serif;
      font-size: 2rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      display: flex;
      align-items: baseline;
      gap: 6px;
    }
    .brand-comma {
      color: var(--accent);
      font-size: 2.4rem;
      line-height: 1;
    }
    .brand-author {
      font-size: 0.88rem;
      color: var(--text-muted);
      margin-top: 4px;
      letter-spacing: 0.04em;
    }

    .prolog {
      border-left: 2px solid var(--accent);
      padding: 6px 0 6px 18px;
      margin-bottom: 36px;
      font-family: 'Lora', serif;
      font-style: italic;
      color: #C8C8D0;
      font-size: 0.98rem;
    }

    .arc-tabs {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding-bottom: 12px;
      margin-bottom: 20px;
      scrollbar-width: none;
    }
    .arc-tabs::-webkit-scrollbar { display: none; }
    .tab-btn {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 8px 14px;
      border-radius: 20px;
      font-size: 0.82rem;
      white-space: nowrap;
      cursor: pointer;
    }
    .tab-btn.active {
      border-color: var(--accent);
      color: var(--text-main);
      background: rgba(212, 175, 55, 0.08);
    }
    .tab-btn.locked {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .arc-header { margin-bottom: 20px; }
    .arc-header h2 {
      font-family: 'Lora', serif;
      font-size: 1.25rem;
      font-weight: 600;
    }
    .arc-header p {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .story-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .story-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 18px 20px;
      cursor: pointer;
      transition: transform 0.15s, background 0.2s, border-color 0.2s;
    }
    .story-card:hover:not(.locked-card) {
      background: var(--surface-hover);
      border-color: #3F3F4A;
      transform: translateY(-1px);
    }
    .story-card.locked-card {
      opacity: 0.5;
      cursor: default;
    }
    .story-meta {
      display: flex;
      justify-content: space-between;
      font-size: 0.78rem;
      color: var(--accent);
      margin-bottom: 6px;
      letter-spacing: 0.05em;
    }
    .story-card.locked-card .story-meta { color: var(--text-muted); }
    .story-title {
      font-family: 'Lora', serif;
      font-size: 1.12rem;
      font-weight: 600;
      margin-bottom: 6px;
    }
    .story-premise {
      font-size: 0.88rem;
      color: var(--text-muted);
      line-height: 1.55;
    }

    #reader-view {
      display: none;
      animation: fadeIn 0.3s ease;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .back-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 0.88rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 24px;
      padding: 6px 0;
    }
    .back-btn:hover { color: var(--accent); }

    .reader-chapter {
      font-size: 0.82rem;
      color: var(--accent);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 8px;
    }
    .reader-title {
      font-family: 'Lora', serif;
      font-size: 1.85rem;
      line-height: 1.3;
      margin-bottom: 28px;
    }
    .reader-body p {
      margin-bottom: 20px;
      font-size: 1.03rem;
      color: #DCDCE0;
    }

    .quote-box {
      margin: 40px 0 28px;
      padding: 20px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
    }
    .quote-text {
      font-family: 'Lora', serif;
      font-style: italic;
      font-size: 0.98rem;
      color: var(--text-main);
      margin-bottom: 14px;
    }
    .action-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }
    .btn {
      padding: 10px 16px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border: 1px solid var(--border);
      transition: all 0.2s;
    }
    .btn-copy {
      background: transparent;
      color: var(--text-main);
    }
    .btn-copy:hover { border-color: var(--accent); color: var(--accent); }
    .btn-wa {
      background: rgba(212, 175, 55, 0.14);
      border-color: var(--accent);
      color: var(--accent);
    }
    .btn-wa:hover {
      background: var(--accent);
      color: #0E0E10;
    }

    footer {
      margin-top: 64px;
      padding-top: 28px;
      border-top: 1px solid var(--border);
      text-align: center;
      font-size: 0.85rem;
      color: var(--text-muted);
    }
    .social-links {
      display: flex;
      justify-content: center;
      gap: 18px;
      margin-top: 14px;
    }
    .social-links a {
      color: var(--text-main);
      text-decoration: none;
      border-bottom: 1px solid var(--border);
      padding-bottom: 2px;
      transition: color 0.2s, border-color 0.2s;
    }
    .social-links a:hover {
      color: var(--accent);
      border-color: var(--accent);
    }
  </style>
</head>
<body>

  <div id="progress-container"><div id="progress-bar"></div></div>

  <div class="container">
    <div id="home-view">
      <header>
        <div class="brand-title">Story of Toqu <span class="brand-comma">,</span></div>
        <div class="brand-author">arsip pikiran &amp; jeda oleh komadua.toqu</div>
      </header>

      <div class="prolog" id="prolog-text"></div>

      <div class="arc-tabs">
        <button class="tab-btn active">Arc 1: Kehampaan</button>
        <button class="tab-btn locked" title="Segera hadir">Arc 2 🔒</button>
        <button class="tab-btn locked" title="Segera hadir">Arc 3 🔒</button>
      </div>

      <div class="arc-header">
        <h2>Arc 1 — Kehampaan yang Menyala Pelan</h2>
        <p>Dua puluh potongan hidup yang berbeda, dihubungkan oleh satu jeda yang sama.</p>
      </div>

      <div class="story-list" id="story-list"></div>
    </div>

    <div id="reader-view">
      <button class="back-btn" onclick="closeStory()">← Kembali ke Arsip</button>
      <div class="reader-chapter" id="reader-chapter"></div>
      <h1 class="reader-title" id="reader-title"></h1>
      <div class="reader-body" id="reader-body"></div>

      <div class="quote-box">
        <div class="quote-text" id="reader-quote"></div>
        <div class="action-row">
          <button class="btn btn-copy" id="copy-btn" onclick="copyQuote()">Salin Kutipan</button>
          <a class="btn btn-wa" id="wa-story-btn" href="#" target="_blank" rel="noopener">Ceritakan Jedamu di WhatsApp ↗</a>
        </div>
      </div>
    </div>

    <footer>
      <div>Tidak semua cerita ditutup dengan titik.</div>
      <div class="social-links">
        <a id="wa-footer-link" href="#" target="_blank" rel="noopener">WhatsApp</a>
        <a id="ig-footer-link" href="#" target="_blank" rel="noopener">Instagram</a>
      </div>
    </footer>
  </div>

  <script src="cerita.js"></script>
  <script>
    const storyListEl = document.getElementById('story-list');
    const homeView = document.getElementById('home-view');
    const readerView = document.getElementById('reader-view');
    const progressContainer = document.getElementById('progress-container');
    const progressBar = document.getElementById('progress-bar');

    document.getElementById('prolog-text').textContent = PROFIL.prolog;
    document.getElementById('wa-footer-link').href = `https://wa.me/${PROFIL.nomorWA}?text=${encodeURIComponent("Halo komadua.toqu, aku baru mampir ke blog Story of Toqu...")}`;
    const igLink = document.getElementById('ig-footer-link');
    igLink.href = `https://instagram.com/${PROFIL.usernameIG}`;
    igLink.textContent = `Instagram @${PROFIL.usernameIG}`;

    DAFTAR_CERITA.forEach((story, index) => {
      const isPublished = story.content && story.content.length > 0;
      const card = document.createElement('div');
      card.className = `story-card ${isPublished ? '' : 'locked-card'}`;
      card.innerHTML = `
        <div class="story-meta">
          <span>BAB ${story.num}</span>
          <span>${isPublished ? (story.readTime || '3 menit baca') : 'Segera hadir'}</span>
        </div>
        <div class="story-title">${story.title}</div>
        <div class="story-premise">${story.premise}</div>
      `;
      if (isPublished) {
        card.onclick = () => openStory(index);
      }
      storyListEl.appendChild(card);
    });

    function openStory(index) {
      const story = DAFTAR_CERITA[index];
      document.getElementById('reader-chapter').textContent = `ARC 1 • BAB ${story.num}`;
      document.getElementById('reader-title').textContent = story.title;
      document.getElementById('reader-body').innerHTML = story.content.map(p => `<p>${p}</p>`).join('');
      document.getElementById('reader-quote').textContent = story.quote || `“${story.premise}”`;

      const waMsg = `Halo komadua.toqu, aku baru saja membaca Bab ${story.num} (${story.title}) di Story of Toqu...`;
      document.getElementById('wa-story-btn').href = `https://wa.me/${PROFIL.nomorWA}?text=${encodeURIComponent(waMsg)}`;

      homeView.style.display = 'none';
      readerView.style.display = 'block';
      progressContainer.style.display = 'block';
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function closeStory() {
      readerView.style.display = 'none';
      progressContainer.style.display = 'none';
      homeView.style.display = 'block';
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function copyQuote() {
      const quote = document.getElementById('reader-quote').textContent;
      navigator.clipboard.writeText(`${quote} — Story of Toqu (@${PROFIL.usernameIG})`).then(() => {
        const btn = document.getElementById('copy-btn');
        btn.textContent = "Tersalin ✓";
        setTimeout(() => { btn.textContent = "Salin Kutipan"; }, 2000);
      });
    }

    window.addEventListener('scroll', () => {
      if (readerView.style.display === 'block') {
        const scrollTop = window.scrollY;
        const docHeight = document.documentElement.scrollHeight - window.innerHeight;
        const percent = docHeight > 0 ? (scrollTop / docHeight) * 100 : 0;
        progressBar.style.width = `${Math.min(percent, 100)}%`;
      }
    });
  </script>
</body>
</html>
