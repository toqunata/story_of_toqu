<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Story of Toqu,, — komadua.toqu</title>

  <!-- Pratinjau Link WhatsApp, Instagram & Media Sosial (Open Graph) -->
  <meta name="description" content="Antologi jeda dan kehampaan. Fragmen-fragmen kehidupan yang terhenti di tengah kalimat — ditulis oleh komadua.toqu." />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Story of Toqu,, — komadua.toqu" />
  <meta property="og:description" content="Tidak semua yang pergi meninggalkan titik. Arsip cerita tentang jeda, rasa yang tertahan, dan ruang sunyi di antara dua koma." />
  <meta property="og:image" content="emblem.jpg" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Story of Toqu,, — komadua.toqu" />
  <meta name="twitter:description" content="Antologi jeda dan kehampaan. Fragmen kehidupan yang terhenti di tengah kalimat." />
  <meta name="twitter:image" content="emblem.jpg" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,400;1,600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #050507;
      --surface: #0C0C10;
      --surface-hover: #121218;
      --text-primary: #F4F4F6;
      --text-secondary: #D4D4D8;
      --ash-silver: #9CA3AF;
      --text-muted: #71717A;
      --crimson: #E11D48;
      --crimson-glow: rgba(225, 29, 72, 0.18);
      --crimson-soft: rgba(225, 29, 72, 0.10);
      --border: #1A1A22;
      --border-hover: #2D2D3A;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg);
      color: var(--text-primary);
      font-family: 'Inter', sans-serif;
      font-weight: 300;
      line-height: 1.85;
      -webkit-font-smoothing: antialiased;
      padding: 0 24px;
      position: relative;
      overflow-x: hidden;
    }

    /* Tekstur Grain Halus & Pencahayaan Dramatis Sampul Buku */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background-image: radial-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 0);
      background-size: 24px 24px;
      pointer-events: none;
      z-index: 0;
    }

    body::after {
      content: "";
      position: fixed;
      top: -10%; right: -5%;
      width: 65vw; height: 65vh;
      background: radial-gradient(circle, rgba(225, 29, 72, 0.07) 0%, rgba(156, 163, 175, 0.025) 40%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    /* Progress Bar Sehelai Rambut */
    #progress-container {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 2px;
      background: rgba(255, 255, 255, 0.03);
      z-index: 100;
      display: none;
    }
    #progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--ash-silver) 0%, var(--crimson) 100%);
      box-shadow: 0 0 8px var(--crimson);
      transition: width 0.1s ease-out;
    }

    .container {
      max-width: 680px;
      margin: 0 auto;
      padding: 72px 0 100px;
      position: relative;
      z-index: 1;
    }

    /* Hero Header dengan Ilustrasi Kupu-Kupu Menyatu di Latar */
    header {
      margin-bottom: 48px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 44px;
      position: relative;
      min-height: 185px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
    }

    .hero-artwork {
      position: absolute;
      right: -18px;
      top: -28px;
      width: 230px;
      height: 230px;
      pointer-events: none;
      z-index: 0;
      opacity: 0.88;
      mix-blend-mode: lighten;
      -webkit-mask-image: radial-gradient(circle at center, black 48%, transparent 76%);
      mask-image: radial-gradient(circle at center, black 48%, transparent 76%);
    }
    .hero-artwork img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .header-content {
      position: relative;
      z-index: 2;
      max-width: 82%;
    }

    .kicker {
      font-size: 0.72rem;
      font-weight: 500;
      letter-spacing: 0.26em;
      text-transform: uppercase;
      color: var(--crimson);
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .kicker::before {
      content: "";
      display: inline-block;
      width: 18px;
      height: 1px;
      background-color: var(--crimson);
    }

    .brand-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 3.2rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      line-height: 1.02;
      color: var(--text-primary);
      text-shadow: 0 4px 24px rgba(0, 0, 0, 0.9);
    }
    .brand-title .comma-mark {
      color: var(--crimson);
      font-style: italic;
      letter-spacing: -0.06em;
      margin-left: 3px;
    }

    .brand-author {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-top: 12px;
      letter-spacing: 0.08em;
    }
    .brand-author strong {
      color: var(--ash-silver);
      font-weight: 400;
    }

    /* Prolog Manifesto */
    .prolog {
      position: relative;
      padding: 20px 24px;
      margin-bottom: 52px;
      background: linear-gradient(90deg, rgba(225, 29, 72, 0.06) 0%, rgba(12, 12, 16, 0.4) 100%);
      border-left: 2px solid var(--crimson);
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      color: var(--text-secondary);
      font-size: 1.28rem;
      line-height: 1.65;
    }

    /* Navigasi Tab Arc */
    .arc-tabs {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
      margin-bottom: 32px;
      gap: 16px;
    }
    .tab-group {
      display: flex;
      gap: 26px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .tab-group::-webkit-scrollbar { display: none; }
    .tab-btn {
      background: none;
      border: none;
      border-bottom: 2px solid transparent;
      color: var(--text-muted);
      padding: 0 0 14px 0;
      font-family: 'Inter', sans-serif;
      font-size: 0.78rem;
      font-weight: 500;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      white-space: nowrap;
      cursor: pointer;
      transition: color 0.2s, border-color 0.2s;
    }
    .tab-btn.active {
      color: var(--text-primary);
      border-bottom-color: var(--crimson);
    }
    .tab-btn.locked {
      opacity: 0.35;
      cursor: not-allowed;
    }
    .arc-counter {
      font-size: 0.72rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--ash-silver);
      padding-bottom: 14px;
      white-space: nowrap;
    }

    /* Judul Sub-Bab Arc */
    .arc-header {
      margin-bottom: 28px;
    }
    .arc-header h2 {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.68rem;
      font-weight: 600;
      color: var(--text-primary);
      letter-spacing: 0.01em;
    }
    .arc-header p {
      font-size: 0.88rem;
      color: var(--text-muted);
      margin-top: 4px;
    }

    /* Daftar Cerita (Kartu Editorial dengan Kilau Tepi) */
    .story-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .story-card {
      padding: 22px 24px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-left: 2px solid transparent;
      cursor: pointer;
      transition: all 0.28s cubic-bezier(0.25, 0.8, 0.25, 1);
      position: relative;
    }
    .story-card:not(.locked-card) {
      border-left-color: var(--crimson);
      background: linear-gradient(135deg, rgba(225, 29, 72, 0.04) 0%, var(--surface) 45%);
    }
    .story-card:hover:not(.locked-card) {
      background: var(--surface-hover);
      border-color: var(--border-hover);
      border-left-color: var(--crimson);
      transform: translateX(4px);
      box-shadow: -6px 0 20px rgba(225, 29, 72, 0.12);
    }
    .story-card.locked-card {
      opacity: 0.45;
      cursor: default;
      background: transparent;
    }

    /* Label Sub-Bab, Penanda Terakhir Dibaca & Durasi Baca */
    .story-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.74rem;
      font-weight: 600;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      margin-bottom: 8px;
      gap: 10px;
    }
    .story-bab-group {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .story-bab {
      color: var(--crimson);
    }
    .last-read-badge {
      font-size: 0.65rem;
      font-weight: 500;
      letter-spacing: 0.14em;
      color: var(--text-primary);
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--border-hover);
      padding: 2px 8px;
    }
    .story-time {
      color: var(--ash-silver);
      font-weight: 400;
      font-size: 0.72rem;
      white-space: nowrap;
    }
    .story-card.locked-card .story-bab,
    .story-card.locked-card .story-time {
      color: var(--text-muted);
      font-weight: 400;
    }

    .story-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.52rem;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 6px;
      line-height: 1.25;
      transition: color 0.2s;
    }
    .story-card:hover:not(.locked-card) .story-title {
      color: #FFFFFF;
    }
    .story-premise {
      font-size: 0.9rem;
      color: var(--text-muted);
      line-height: 1.65;
    }

    /* Mode Baca (Reader View) */
    #reader-view {
      display: none;
      animation: fadeIn 0.35s ease;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .back-btn {
      background: none;
      border: none;
      color: var(--ash-silver);
      font-size: 0.78rem;
      font-weight: 500;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 36px;
      padding: 4px 0;
      transition: color 0.2s;
    }
    .back-btn:hover { color: var(--crimson); }

    .reader-chapter {
      font-size: 0.76rem;
      font-weight: 600;
      color: var(--crimson);
      letter-spacing: 0.22em;
      text-transform: uppercase;
      margin-bottom: 10px;
    }
    .reader-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 2.6rem;
      font-weight: 600;
      line-height: 1.16;
      color: var(--text-primary);
      margin-bottom: 36px;
      padding-bottom: 24px;
      border-bottom: 1px solid var(--border);
    }
    .reader-body p {
      margin-bottom: 24px;
      font-size: 1.05rem;
      color: var(--text-secondary);
    }
    .reader-body p:first-of-type::first-letter {
      font-family: 'Cormorant Garamond', serif;
      font-size: 3.4rem;
      font-weight: 600;
      float: left;
      line-height: 0.82;
      padding-right: 12px;
      padding-top: 4px;
      color: var(--crimson);
    }

    /* Kotak Kutipan & Jembatan WhatsApp */
    .quote-box {
      margin: 52px 0 28px;
      padding: 28px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-left: 2px solid var(--crimson);
    }
    .quote-text {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: 1.22rem;
      color: var(--text-primary);
      margin-bottom: 20px;
      line-height: 1.6;
    }
    .action-row {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }
    .btn {
      padding: 11px 18px;
      font-size: 0.76rem;
      font-weight: 500;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border: 1px solid var(--border);
      transition: all 0.25s ease;
    }
    .btn-copy {
      background: transparent;
      color: var(--ash-silver);
    }
    .btn-copy:hover {
      border-color: var(--text-primary);
      color: var(--text-primary);
    }
    .btn-wa {
      background: var(--crimson-soft);
      border-color: var(--crimson);
      color: #FDA4AF;
    }
    .btn-wa:hover {
      background: var(--crimson);
      color: #FFFFFF;
    }

    /* Navigasi Antar-Bab di Bawah Cerita */
    .chapter-nav {
      display: flex;
      justify-content: space-between;
      align-items: stretch;
      gap: 12px;
      margin-top: 24px;
    }
    .nav-chapter-btn {
      flex: 1;
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 16px 18px;
      text-align: left;
      cursor: pointer;
      transition: all 0.25s ease;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .nav-chapter-btn.next {
      text-align: right;
      align-items: flex-end;
    }
    .nav-chapter-btn:hover:not(:disabled) {
      border-color: var(--crimson);
      background: var(--surface-hover);
    }
    .nav-chapter-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      background: transparent;
    }
    .nav-label {
      font-size: 0.68rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--crimson);
      font-weight: 500;
    }
    .nav-chapter-btn:disabled .nav-label {
      color: var(--text-muted);
    }
    .nav-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.15rem;
      color: var(--text-primary);
      font-weight: 600;
    }

    /* Footer */
    footer {
      margin-top: 84px;
      padding-top: 32px;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
      font-size: 0.82rem;
      color: var(--text-muted);
    }
    .social-links {
      display: flex;
      gap: 22px;
    }
    .social-links a {
      color: var(--ash-silver);
      text-decoration: none;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      font-size: 0.74rem;
      transition: color 0.2s;
    }
    .social-links a:hover {
      color: var(--crimson);
    }

    @media (max-width: 520px) {
      .brand-title { font-size: 2.45rem; }
      .hero-artwork { width: 175px; height: 175px; right: -12px; top: -18px; opacity: 0.75; }
      .header-content { max-width: 90%; }
      .reader-title { font-size: 2.05rem; }
      .chapter-nav { flex-direction: column; }
      .nav-chapter-btn.next { text-align: left; align-items: flex-start; }
    }
  </style>
</head>
<body>

  <div id="progress-container"><div id="progress-bar"></div></div>

  <div class="container">
    <div id="home-view">
      <header>
        <!-- Ilustrasi Kupu-Kupu Menyatu Langsung dengan Latar Gelap -->
        <div class="hero-artwork" aria-hidden="true">
          <img id="emblem-img" src="emblem.jpg" alt="" />
        </div>

        <div class="header-content">
          <div class="kicker">Antologi Jeda &amp; Kehampaan</div>
          <h1 class="brand-title">Story of Toqu<span class="comma-mark">,,</span></h1>
          <div class="brand-author">ditulis oleh <strong>komadua.toqu</strong></div>
        </div>
      </header>

      <div class="prolog" id="prolog-text"></div>

      <div class="arc-tabs">
        <div class="tab-group">
          <button class="tab-btn active">Arc I — Kehampaan</button>
          <button class="tab-btn locked" title="Belum dibuka">Arc II — Terkunci</button>
          <button class="tab-btn locked" title="Belum dibuka">Arc III — Terkunci</button>
        </div>
        <div class="arc-counter" id="arc-counter"></div>
      </div>

      <div class="arc-header">
        <h2>Kehampaan yang Menyala Pelan</h2>
        <p>Dua puluh fragmen kehidupan yang terhenti di tengah kalimat.</p>
      </div>

      <div class="story-list" id="story-list"></div>
    </div>

    <div id="reader-view">
      <button class="back-btn" onclick="closeStory()">← Kembali ke Awal</button>
      <div class="reader-chapter" id="reader-chapter"></div>
      <h1 class="reader-title" id="reader-title"></h1>
      <div class="reader-body" id="reader-body"></div>

      <div class="quote-box">
        <div class="quote-text" id="reader-quote"></div>
        <div class="action-row">
          <button class="btn btn-copy" id="copy-btn" onclick="copyQuote()">Salin Kutipan</button>
          <a class="btn btn-wa" id="wa-story-btn" href="#" target="_blank" rel="noopener">Kirim Catatan ke WhatsApp ↗</a>
        </div>
      </div>

      <!-- Navigasi Bab Sebelumnya & Bab Selanjutnya -->
      <div class="chapter-nav">
        <button class="nav-chapter-btn prev" id="prev-chapter-btn"></button>
        <button class="nav-chapter-btn next" id="next-chapter-btn"></button>
      </div>
    </div>

    <footer>
      <div>Tidak semua yang pergi meninggalkan titik.</div>
      <div class="social-links">
        <a id="wa-footer-link" href="#" target="_blank" rel="noopener">WhatsApp</a>
        <a id="ig-footer-link" href="#" target="_blank" rel="noopener">Instagram</a>
      </div>
    </footer>
  </div>

  <script src="cerita.js"></script>
  <script>
    // Deteksi otomatis ekstensi file gambar emblem
    const emblemImg = document.getElementById('emblem-img');
    const emblemCandidates = ['emblem.jpeg', 'emblem.png', 'emblem.webp', 'Emblem.jpg', 'Emblem.jpeg', 'Emblem.png'];
    let candidateIdx = 0;
    emblemImg.onerror = function() {
      if (candidateIdx < emblemCandidates.length) {
        this.src = emblemCandidates[candidateIdx++];
      } else {
        this.parentElement.style.display = 'none';
      }
    };

    const storyListEl = document.getElementById('story-list');
    const homeView = document.getElementById('home-view');
    const readerView = document.getElementById('reader-view');
    const progressContainer = document.getElementById('progress-container');
    const progressBar = document.getElementById('progress-bar');

    document.getElementById('prolog-text').textContent = PROFIL.prolog;
    document.getElementById('wa-footer-link').href = `https://wa.me/${PROFIL.nomorWA}?text=${encodeURIComponent("Halo komadua.toqu, aku baru saja membaca arsip Story of Toqu...")}`;
    const igLink = document.getElementById('ig-footer-link');
    igLink.href = `https://instagram.com/${PROFIL.usernameIG}`;
    igLink.textContent = `@${PROFIL.usernameIG}`;

    // Hitung jumlah bab yang sudah terbit otomatis
    const publishedCount = DAFTAR_CERITA.filter(s => s.content && s.content.length > 0).length;
    document.getElementById('arc-counter').textContent = `${String(publishedCount).padStart(2, '0')} / ${DAFTAR_CERITA.length} Terbit`;

    function renderStoryList() {
      storyListEl.innerHTML = '';
      const lastReadNum = localStorage.getItem('toqu_last_read');

      DAFTAR_CERITA.forEach((story, index) => {
        const isPublished = story.content && story.content.length > 0;
        const isLastRead = isPublished && lastReadNum === story.num;

        const card = document.createElement('div');
        card.className = `story-card ${isPublished ? '' : 'locked-card'}`;
        card.innerHTML = `
          <div class="story-meta">
            <div class="story-bab-group">
              <span class="story-bab">Bab ${story.num}</span>
              ${isLastRead ? '<span class="last-read-badge">• Terakhir Dibaca</span>' : ''}
            </div>
            <span class="story-time">${isPublished ? (story.readTime || '3 menit baca') : 'Belum terbit'}</span>
          </div>
          <div class="story-title">${story.title}</div>
          <div class="story-premise">${story.premise}</div>
        `;
        if (isPublished) {
          card.onclick = () => openStory(index);
        }
        storyListEl.appendChild(card);
      });
    }

    function openStory(index) {
      const story = DAFTAR_CERITA[index];
      localStorage.setItem('toqu_last_read', story.num);

      document.getElementById('reader-chapter').textContent = `Arc I • Bab ${story.num}`;
      document.getElementById('reader-title').textContent = story.title;
      document.getElementById('reader-body').innerHTML = story.content.map(p => `<p>${p}</p>`).join('');
      document.getElementById('reader-quote').textContent = story.quote || `“${story.premise}”`;

      const waMsg = `Halo komadua.toqu, aku baru selesai membaca Bab ${story.num} (${story.title}) di Story of Toqu...`;
      document.getElementById('wa-story-btn').href = `https://wa.me/${PROFIL.nomorWA}?text=${encodeURIComponent(waMsg)}`;

      // Atur Tombol Bab Sebelumnya
      const prevBtn = document.getElementById('prev-chapter-btn');
      const prevStory = index > 0 ? DAFTAR_CERITA[index - 1] : null;
      if (prevStory && prevStory.content && prevStory.content.length > 0) {
        prevBtn.disabled = false;
        prevBtn.innerHTML = `<span class="nav-label">← Bab Sebelumnya</span><span class="nav-title">Bab ${prevStory.num}: ${prevStory.title}</span>`;
        prevBtn.onclick = () => openStory(index - 1);
      } else {
        prevBtn.disabled = true;
        prevBtn.innerHTML = `<span class="nav-label">Awal Arsip</span><span class="nav-title">Ini adalah bab pembuka</span>`;
        prevBtn.onclick = null;
      }

      // Atur Tombol Bab Selanjutnya
      const nextBtn = document.getElementById('next-chapter-btn');
      const nextStory = index < DAFTAR_CERITA.length - 1 ? DAFTAR_CERITA[index + 1] : null;
      if (nextStory && nextStory.content && nextStory.content.length > 0) {
        nextBtn.disabled = false;
        nextBtn.innerHTML = `<span class="nav-label">Bab Selanjutnya →</span><span class="nav-title">Bab ${nextStory.num}: ${nextStory.title}</span>`;
        nextBtn.onclick = () => openStory(index + 1);
      } else if (nextStory) {
        nextBtn.disabled = true;
        nextBtn.innerHTML = `<span class="nav-label">Belum Terbit</span><span class="nav-title">Bab ${nextStory.num}: ${nextStory.title}</span>`;
        nextBtn.onclick = null;
      } else {
        nextBtn.disabled = true;
        nextBtn.innerHTML = `<span class="nav-label">Akhir Arc I</span><span class="nav-title">Jeda berlanjut ke Arc II</span>`;
        nextBtn.onclick = null;
      }

      homeView.style.display = 'none';
      readerView.style.display = 'block';
      progressContainer.style.display = 'block';
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function closeStory() {
      readerView.style.display = 'none';
      progressContainer.style.display = 'none';
      renderStoryList();
      homeView.style.display = 'block';
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function copyQuote() {
      const quote = document.getElementById('reader-quote').textContent;
      navigator.clipboard.writeText(`${quote} — Story of Toqu (@${PROFIL.usernameIG})`).then(() => {
        const btn = document.getElementById('copy-btn');
        btn.textContent = "Tersalin";
        setTimeout(() => { btn.textContent = "Salin Kutipan"; }, 2000);
      });
    }

    window.addEventListener('scroll', () => {
      if (readerView.style.display === 'block') {
        const scrollTop = window.scrollY;
        const docHeight = document.documentElement.scrollHeight - window.innerHeight;
        const percent = docHeight > 0 ? (scrollTop / docHeight) * 100 : 0;
        progressBar.style.width = `${Math.min(percent, 100)}%`;
      }
    });

    renderStoryList();
  </script>
</body>
</html>
